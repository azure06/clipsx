schemaVersion = 2
contractRevision = 2
packageId = "example.mermaid-viewer"
version = "1.0.0"
apiVersion = "^2.0"
displayName = "Mermaid Viewer"
description = "Offline Mermaid detection with an isolated bundled detail and dialog view."
license = "MIT"

[[contributions]]
id = "detect-mermaid"
kind = "detector"
displayName = "Mermaid detector"
emitsFacetIds = ["mermaid"]

[[contributions.matchers]]
mimeTypes = ["text/plain"]

[[contributions]]
id = "mermaid-detail"
kind = "renderer"
displayName = "Mermaid diagram"
purpose = "structured"
surfaces = ["detail"]
iconAsset = "icons/mermaid.svg"
uiEntry = "ui/index.html"
uiSurfaces = ["detail", "dialog"]

[[contributions.matchers]]
facetIds = ["example.mermaid-viewer.mermaid"]

[[contributions]]
id = "open-mermaid-dialog"
kind = "action"
displayName = "Open Mermaid diagram"
iconAsset = "icons/mermaid.svg"
placements = ["action_menu"]
effects = ["open_dialog"]
handler = { kind = "dialog" }
uiSurfaces = ["dialog"]
uiEntry = "ui/index.html"

[[contributions.matchers]]
facetIds = ["example.mermaid-viewer.mermaid"]
