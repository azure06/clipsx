<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mermaid Viewer</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main>
      <nav aria-label="Diagram actions">
        <button id="expand" type="button">Expand</button>
        <button id="close" type="button" hidden>Close dialog</button>
      </nav>
      <div id="diagram" role="img" aria-label="Mermaid diagram preview"></div>
      <details open><summary>Accessible source</summary><pre id="source"></pre></details>
    </main>
    <script src="../__clipsx/context.js"></script>
    <script src="mermaid.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
