schemaVersion = 2
contractRevision = 2
packageId = "example.color-tools"
version = "1.0.0"
apiVersion = "^2.0"
displayName = "Color Tools"
description = "Recognize colors, render swatches, and copy normalized color formats."
license = "MIT"

[[contributions]]
id = "detect-color"
kind = "detector"
displayName = "Color detector"
emitsFacetIds = ["color"]

[[contributions.matchers]]
mimeTypes = ["text/plain"]

[[contributions]]
id = "color-card"
kind = "renderer"
displayName = "Color"
purpose = "semantic"
surfaces = ["detail", "compact"]
icon = "palette"

[[contributions.matchers]]
facetIds = ["example.color-tools.color"]

[[contributions]]
id = "format-color"
kind = "transformer"
displayName = "Format color"
parameterSchema = { type = "object", properties = { format = { type = "string", enum = ["hex", "rgb", "hsl"] } }, required = ["format"] }

[[contributions.matchers]]
mimeTypes = ["text/plain"]

[[contributions]]
id = "copy-hex"
kind = "action"
displayName = "Copy as HEX"
icon = "palette"
effects = ["copy"]
placements = ["preview_toolbar", "action_menu"]
handler = { kind = "transformer_preset", transformerId = "format-color", parameters = { format = "hex" }, disposition = "copy" }

[[contributions.matchers]]
facetIds = ["example.color-tools.color"]

[[contributions]]
id = "copy-rgb"
kind = "action"
displayName = "Copy as RGB"
icon = "palette"
effects = ["copy"]
placements = ["preview_toolbar", "action_menu"]
handler = { kind = "transformer_preset", transformerId = "format-color", parameters = { format = "rgb" }, disposition = "copy" }

[[contributions.matchers]]
facetIds = ["example.color-tools.color"]

[[contributions]]
id = "copy-hsl"
kind = "action"
displayName = "Copy as HSL"
icon = "palette"
effects = ["copy"]
placements = ["preview_toolbar", "action_menu"]
handler = { kind = "transformer_preset", transformerId = "format-color", parameters = { format = "hsl" }, disposition = "copy" }

[[contributions.matchers]]
facetIds = ["example.color-tools.color"]
