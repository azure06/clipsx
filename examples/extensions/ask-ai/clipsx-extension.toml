schemaVersion = 2
contractRevision = 2
packageId = "example.ask-ai"
version = "1.0.2"
apiVersion = "^2.0"
displayName = "Ask AI"
description = "Open selected text as an encoded prompt in ChatGPT or Claude."
license = "MIT"

[[contributions]]
id = "ask-chatgpt"
kind = "action"
displayName = "Ask ChatGPT"
iconAssets = { light = "icons/chatgpt-black.svg", dark = "icons/chatgpt-white.svg" }
iconScale = 1.85
placements = ["preview_toolbar", "action_menu"]
effects = ["open_https_url"]
handler = { kind = "guest" }

[[contributions.matchers]]
mimeTypes = ["text/plain"]

[[contributions]]
id = "ask-claude"
kind = "action"
displayName = "Ask Claude"
iconAssets = { light = "icons/claude-rounded.svg", dark = "icons/claude-rounded.svg" }
placements = ["preview_toolbar", "action_menu"]
effects = ["open_https_url"]
handler = { kind = "guest" }

[[contributions.matchers]]
mimeTypes = ["text/plain"]

[[permissions.externalNavigation]]
origin = "https://chatgpt.com"

[[permissions.externalNavigation]]
origin = "https://claude.ai"
