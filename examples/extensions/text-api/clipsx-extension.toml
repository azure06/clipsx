schemaVersion = 2
contractRevision = 2
packageId = "example.text-api"
version = "1.0.0"
apiVersion = "^2.0"
displayName = "Text API"
description = "Send selected text through the host HTTPS broker and reuse the response."
license = "MIT"

[[contributions]]
id = "send-text"
kind = "action"
displayName = "Send to Text API"
iconAsset = "icons/network.svg"
placements = ["preview_toolbar", "action_menu"]
execution = "capability_backed"
effects = ["open_dialog", "preview", "copy", "save_as_clip"]
handler = { kind = "dialog" }
uiSurfaces = ["dialog"]
uiEntry = "ui/index.html"

[[contributions.matchers]]
mimeTypes = ["text/plain"]

[[permissions.http]]
origin = "https://httpbin.org"
pathPatterns = ["/anything"]
methods = ["POST"]
maxRequestBytes = 1048576
maxResponseBytes = 1048576
timeoutMs = 10000
