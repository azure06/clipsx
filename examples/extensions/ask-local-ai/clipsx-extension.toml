schemaVersion = 2
contractRevision = 2
packageId = "example.ask-local-ai"
version = "1.0.0"
apiVersion = "^2.0"
displayName = "Ask Local AI"
description = "Generate an answer with the host-configured local text provider."
license = "MIT"

[[contributions]]
id = "ask-local-ai"
kind = "action"
displayName = "Ask Local AI"
iconAsset = "icons/sparkles.svg"
placements = ["preview_toolbar", "action_menu"]
effects = ["preview", "copy", "save_as_clip"]
execution = "capability_backed"
handler = { kind = "guest" }
parameterSchema = { type = "object", properties = { instruction = { type = "string", title = "Instruction", default = "Answer the user's request using the clipboard text below.", minLength = 1, maxLength = 2000 }, output = { type = "string", title = "Output", enum = ["preview", "copy", "save_as_clip"], default = "preview" } }, additionalProperties = false }

[[contributions.matchers]]
mimeTypes = ["text/plain"]

[permissions]
providers = ["generation.text"]
