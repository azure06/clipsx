name: Shared application checks
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      build-attempt:
        value: ${{ jobs.frontend.outputs.build-attempt }}
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_API_PRIVATE_KEY:
        required: false
      APPLE_API_KEY:
        required: false
      APPLE_API_ISSUER:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
env:
  NODE_VERSION: '24'
jobs:
  frontend:
    name: Frontend and dependency checks
    runs-on: ubuntu-24.04
    outputs:
      build-attempt: ${{ steps.epoch.outputs.attempt }}
      version: ${{ steps.identity.outputs.version }}
    env:
      RELEASE_MODE: ${{ inputs.release }}
      VITE_SUPABASE_URL: ${{ inputs.release && vars.VITE_SUPABASE_URL || '' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.release && vars.VITE_SUPABASE_PUBLISHABLE_KEY || '' }}
      VITE_NEXT_PUBLIC_SITE_URL: ${{ inputs.release && vars.VITE_NEXT_PUBLIC_SITE_URL || '' }}
      VITE_SENTRY_DSN: ${{ inputs.release && vars.SENTRY_DESKTOP_DSN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          prefix-key: ${{ inputs.release && 'release' || 'pr' }}
          shared-key: policy
          cache-targets: false
          cache-bin: false
          cache-on-failure: true
      - name: Install pinned audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-cyclonedx@0.5.9
      - name: Record build generation
        id: epoch
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Validate candidate identity
        if: inputs.release
        id: identity
        run: node scripts/release/pipeline.mjs initialize
      - name: Frontend, policy and production build
        env:
          SENTRY_AUTH_TOKEN: ${{ inputs.release && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: infiniti-next
          SENTRY_PROJECT: clipsx-desktop
          SENTRY_RELEASE: ${{ inputs.release && format('clipsx-desktop@{0}+{1}', steps.identity.outputs.version, github.sha) || '' }}
          VITE_SENTRY_RELEASE: ${{ inputs.release && format('clipsx-desktop@{0}+{1}', steps.identity.outputs.version, github.sha) || '' }}
        run: npm run release:preflight -- frontend
      - name: Require a live signed v3 extension catalog
        if: inputs.release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/azure06/clipsx-registry.git /tmp/clipsx-registry
          cd /tmp/clipsx-registry
          npm ci
          npm run validate -- --require-current --download-dir .downloads --verify-releases
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            for (const name of ["index.json", "index.signatures.json"]) {
              const response = await fetch(`https://raw.githubusercontent.com/azure06/clipsx-registry/main/${name}`, { cache: "no-store" })
              if (!response.ok || !Buffer.from(await response.arrayBuffer()).equals(readFileSync(name))) process.exit(1)
            }
            const index = JSON.parse(readFileSync("index.json", "utf8"))
            if (index.schemaVersion !== 4 || !index.packages?.length || index.packages.some(item => item.apiVersion !== "^3.2")) process.exit(1)
          '
      - name: Scan repository for secrets
        if: inputs.release
        uses: gitleaks/gitleaks-action@v2
      - name: Upload dependency evidence
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: release-sbom-${{ github.run_attempt }}
          path: src-tauri/clipsx.cdx.json
          if-no-files-found: error

      - name: Archive checked frontend and candidate identity
        run: |
          tar -czf .release/frontend.tar.gz dist src-tauri/tauri.auth.csp.conf.json src-tauri/tauri.ci-build.conf.json
      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: frontend-${{ github.run_attempt }}
          path: |
            .release/frontend.tar.gz
            .release/frontend.json
            .release/candidate.json
          if-no-files-found: error
          retention-days: 30
  native:
    needs: frontend
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      BUILD_RUN_ATTEMPT: ${{ needs.frontend.outputs.build-attempt }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      NATIVE_TARGET: ${{ matrix.target }}
      RELEASE_MODE: ${{ inputs.release }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_NEXT_PUBLIC_SITE_URL: ${{ vars.VITE_NEXT_PUBLIC_SITE_URL }}
      SENTRY_DSN: ${{ vars.SENTRY_DESKTOP_DSN }}
      VITE_SENTRY_DSN: ${{ vars.SENTRY_DESKTOP_DSN }}
      SENTRY_RELEASE: clipsx-desktop@${{ needs.frontend.outputs.version }}+${{ github.sha }}
      VITE_SENTRY_RELEASE: clipsx-desktop@${{ needs.frontend.outputs.version }}+${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          prefix-key: ${{ inputs.release && 'release' || 'pr' }}
          shared-key: ${{ matrix.platform }}
          cache-on-failure: true
          cache-workspace-crates: true
      - run: npm ci
        if: inputs.release
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ needs.frontend.outputs.build-attempt }}
          path: .release
      - name: Restore and verify frontend before Cargo
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.release }}
        run: |
          tar -xzf .release/frontend.tar.gz
          node scripts/release/frontend.mjs verify
      - name: Look up compiled checkpoint
        if: inputs.release
        id: checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/checkpoint.mjs lookup
      - name: Restore existing compiled checkpoint
        if: inputs.release && steps.checkpoint.outputs.exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: compiled-${{ matrix.platform }}-${{ needs.frontend.outputs.build-attempt }}
          path: .release
      - name: Verify compiled checkpoint
        if: inputs.release && steps.checkpoint.outputs.exists == 'true'
        shell: bash
        run: |
          tar -xzf .release/compiled.tar.gz
          node scripts/release/checkpoint.mjs verify
      - name: Rust quality and auxiliary tests
        if: runner.os == 'Linux' && steps.checkpoint.outputs.exists != 'true'
        run: npm run release:preflight -- quality
      - name: Native application tests
        if: steps.checkpoint.outputs.exists != 'true'
        run: npm run release:preflight -- native
      - name: Default-feature compile coverage
        if: runner.os == 'Linux' && !inputs.release
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin clipsx
      - name: Compile production executable without bundling
        if: inputs.release && steps.checkpoint.outputs.exists != 'true'
        shell: bash
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --target "$TARGET" --no-bundle --config src-tauri/tauri.auth.csp.conf.json --config src-tauri/tauri.production-build.conf.json --config src-tauri/tauri.ci-build.conf.json
      - name: Save verified compiled checkpoint
        if: inputs.release && steps.checkpoint.outputs.exists != 'true'
        shell: bash
        run: |
          node scripts/release/checkpoint.mjs record
          binary="src-tauri/target/$TARGET/release/clipsx"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          tar -czf .release/compiled.tar.gz "$binary" .release/compiled.json
      - uses: actions/upload-artifact@v4
        if: inputs.release && steps.checkpoint.outputs.exists != 'true'
        with:
          name: compiled-${{ matrix.platform }}-${{ needs.frontend.outputs.build-attempt }}
          path: .release/compiled.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Configure Developer ID and notarization
        if: inputs.release && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_PASSWORD" "$APPLE_SIGNING_IDENTITY" "$APPLE_API_PRIVATE_KEY" "$APPLE_API_KEY" "$APPLE_API_ISSUER"; do test -n "$value"; done
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          keychain="$RUNNER_TEMP/clipsx-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/notarization.p8"
          chmod 600 "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notarization.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notarization.p8" >> "$GITHUB_ENV"
      - name: Bundle and sign macOS or Linux without compilation
        if: inputs.release && runner.os != 'Windows'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        shell: bash
        run: node node_modules/@tauri-apps/cli/tauri.js bundle --ci --target "$TARGET" --bundles "$BUNDLES" --config src-tauri/tauri.auth.csp.conf.json --config src-tauri/tauri.production-build.conf.json --config src-tauri/tauri.ci-build.conf.json
      - name: Verify Apple signatures and notarize distributed DMG
        if: inputs.release && runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          exec > >(tee .release/native-verification.log) 2>&1
          codesign --verify --deep --strict "$bundle/macos/ClipsX.app"
          details="$(codesign --display --verbose=2 "$bundle/macos/ClipsX.app" 2>&1)"
          printf '%s\n' "$details"
          [[ "$details" == *runtime* ]]
          spctl --assess --verbose=4 --type execute "$bundle/macos/ClipsX.app"
          xcrun stapler validate "$bundle/macos/ClipsX.app"
          for dmg in "$bundle"/dmg/*.dmg; do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            codesign --verify --strict "$dmg"
            spctl --assess --verbose=4 --type open --context context:primary-signature "$dmg"
          done
      - name: Inspect Linux packages
        if: inputs.release && runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          exec > >(tee .release/native-verification.log) 2>&1
          for deb in "$bundle"/deb/*.deb; do dpkg-deb --info "$deb"; dpkg-deb --contents "$deb"; done
          for image in "$bundle"/appimage/*.AppImage; do test -x "$image"; done
      - name: Collect verified packages
        if: inputs.release && runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          node scripts/release/native-evidence.mjs "$PLATFORM"
          node scripts/release/pipeline.mjs collect "$PLATFORM" "src-tauri/target/$TARGET/release/bundle"
      - name: Export Windows signing inputs
        if: inputs.release && runner.os == 'Windows'
        run: node scripts/release/pipeline.mjs windows-kit
      - uses: actions/upload-artifact@v4
        if: inputs.release && runner.os == 'Windows'
        with:
          include-hidden-files: true
          overwrite: true
          name: windows-signing-inputs-${{ needs.frontend.outputs.build-attempt }}
          path: .release/windows-kit/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: inputs.release && runner.os != 'Windows'
        with:
          include-hidden-files: true
          overwrite: true
          name: packages-${{ matrix.platform }}-${{ needs.frontend.outputs.build-attempt }}
          path: .release/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove Apple credentials
        if: always() && inputs.release && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/clipsx-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notarization.p8"
