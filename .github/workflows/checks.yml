name: Shared application checks
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    outputs:
      build-attempt:
        value: ${{ jobs.frontend.outputs.build-attempt }}
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
permissions:
  contents: read
  actions: read
env:
  NODE_VERSION: '24'
  RELEASE_TOOLS_ROOT: .tooling/scripts/release
jobs:
  frontend:
    name: Frontend and dependency checks
    runs-on: ubuntu-24.04
    outputs:
      build-attempt: ${{ steps.epoch.outputs.attempt }}
      version: ${{ steps.identity.outputs.version }}
      recipe-revision: ${{ steps.recipe.outputs.revision }}
      matrix: ${{ steps.recipe.outputs.matrix }}
    env:
      RELEASE_MODE: ${{ inputs.release }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_NEXT_PUBLIC_SITE_URL: ${{ vars.VITE_NEXT_PUBLIC_SITE_URL }}
      VITE_SENTRY_DSN: ${{ inputs.release && vars.SENTRY_DESKTOP_DSN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .tooling
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          prefix-key: ${{ inputs.release && 'release' || 'pr' }}
          shared-key: policy
          cache-targets: false
          cache-bin: false
          cache-on-failure: true
      - name: Record trusted build recipe revision
        id: recipe
        shell: bash
        run: |
          revision="$(git -C .tooling rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "RELEASE_RECIPE_REVISION=$revision" >> "$GITHUB_ENV"
          node .tooling/scripts/release/builds.mjs matrix
      - name: Install pinned audit tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-cyclonedx@0.5.9
      - name: Record build generation
        id: epoch
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Validate candidate identity
        if: inputs.release
        id: identity
        run: node .tooling/scripts/release/pipeline.mjs initialize
      - name: Frontend, policy and production build
        env:
          SENTRY_AUTH_TOKEN: ${{ inputs.release && secrets.SENTRY_AUTH_TOKEN || '' }}
          SENTRY_ORG: infiniti-next
          SENTRY_PROJECT: clipsx-desktop
          SENTRY_RELEASE: ${{ inputs.release && format('clipsx-desktop@{0}+{1}', steps.identity.outputs.version, github.sha) || '' }}
          VITE_SENTRY_RELEASE: ${{ inputs.release && format('clipsx-desktop@{0}+{1}', steps.identity.outputs.version, github.sha) || '' }}
        run: npm exec -- node .tooling/scripts/release/preflight.mjs frontend
      - name: Require a live signed v3 extension catalog
        if: inputs.release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/azure06/clipsx-registry.git /tmp/clipsx-registry
          cd /tmp/clipsx-registry
          npm ci
          npm run validate -- --require-current --download-dir .downloads --verify-releases
          node "$GITHUB_WORKSPACE/.tooling/scripts/release/registry-check.mjs"
      - name: Scan repository for secrets
        if: inputs.release
        uses: gitleaks/gitleaks-action@v2
      - name: Upload dependency evidence
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: release-sbom-${{ github.run_attempt }}
          path: src-tauri/clipsx.cdx.json
          if-no-files-found: error

      - name: Archive checked frontend and candidate identity
        run: |
          tar -czf .release/frontend.tar.gz dist src-tauri/tauri.auth.csp.conf.json src-tauri/tauri.ci-build.conf.json
      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: frontend-${{ github.run_attempt }}
          path: |
            .release/frontend.tar.gz
            .release/frontend.json
            .release/candidate.json
          if-no-files-found: error
          retention-days: 30
  native:
    needs: frontend
    name: Native ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.frontend.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      BUILD_RUN_ATTEMPT: ${{ needs.frontend.outputs.build-attempt }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      NATIVE_TARGET: ${{ matrix.target }}
      CLIPSX_RUNTIME_FIXTURE_PATH: ${{ github.workspace }}/.release/runtime-fixture.wasm
      RELEASE_MODE: ${{ inputs.release }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_NEXT_PUBLIC_SITE_URL: ${{ vars.VITE_NEXT_PUBLIC_SITE_URL }}
      SENTRY_DSN: ${{ vars.SENTRY_DESKTOP_DSN }}
      VITE_SENTRY_DSN: ${{ vars.SENTRY_DESKTOP_DSN }}
      SENTRY_RELEASE: clipsx-desktop@${{ needs.frontend.outputs.version }}+${{ github.sha }}
      VITE_SENTRY_RELEASE: clipsx-desktop@${{ needs.frontend.outputs.version }}+${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.frontend.outputs.recipe-revision }}
          path: .tooling
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          prefix-key: ${{ inputs.release && 'release' || 'pr' }}
          shared-key: ${{ matrix.platform }}
          cache-on-failure: true
          cache-workspace-crates: true
      - run: npm ci
        if: inputs.release
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ needs.frontend.outputs.build-attempt }}
          path: .release
      - name: Restore and verify frontend before Cargo
        shell: bash
        env:
          RELEASE_MODE: ${{ inputs.release }}
        run: |
          tar -xzf .release/frontend.tar.gz
          node .tooling/scripts/release/frontend.mjs verify
      - name: Rust quality and auxiliary tests
        if: runner.os == 'Linux'
        run: npm exec -- node .tooling/scripts/release/preflight.mjs quality
      - name: Native application tests
        run: npm exec -- node .tooling/scripts/release/preflight.mjs native
      - name: Default-feature compile coverage
        if: runner.os == 'Linux' && !inputs.release
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bin clipsx
      - name: Compile production executable without bundling
        if: inputs.release
        env:
          CARGO_PROFILE_RELEASE_DEBUG: ${{ runner.os == 'macOS' && 'line-tables-only' || '0' }}
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ runner.os == 'macOS' && 'packed' || 'off' }}
        shell: bash
        run: node node_modules/@tauri-apps/cli/tauri.js build --ci --target "$TARGET" --no-bundle --config src-tauri/tauri.auth.csp.conf.json --config src-tauri/tauri.production-build.conf.json --config src-tauri/tauri.ci-build.conf.json
      - name: Save verified compiled checkpoint
        if: inputs.release
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            symbols="src-tauri/target/$TARGET/release/clipsx.dSYM"
            test -d "$symbols"
            tar -h -czf .release/debug-symbols.tar.gz -C "$(dirname "$symbols")" clipsx.dSYM
          fi
          node .tooling/scripts/release/builds.mjs record
          binary="src-tauri/target/$TARGET/release/clipsx"
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          files=("$binary" .release/compiled.json .release/runtime-fixture.wasm)
          if [[ "$RUNNER_OS" == macOS ]]; then files+=(.release/debug-symbols.tar.gz); fi
          tar -czf .release/compiled.tar.gz "${files[@]}"
      - uses: actions/upload-artifact@v4
        if: inputs.release
        with:
          name: compiled-${{ matrix.platform }}-${{ needs.frontend.outputs.build-attempt }}
          path: .release/compiled.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
