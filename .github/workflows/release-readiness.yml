name: Release eligibility
on:
  workflow_run:
    workflows:
      [Build release app, Prepare release candidate, Finalize release candidate, Certify candidate]
    types: [completed]
  workflow_dispatch:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_NEXT_PUBLIC_SITE_URL: ${{ vars.VITE_NEXT_PUBLIC_SITE_URL }}
  VITE_SENTRY_DSN: ${{ vars.SENTRY_DESKTOP_DSN }}
permissions:
  contents: write
  actions: read
  statuses: write
jobs:
  eligibility:
    name: Evaluate release eligibility
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute the PR head in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set Release readiness commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/pipeline.mjs readiness
