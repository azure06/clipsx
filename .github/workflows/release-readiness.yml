name: Release eligibility
on:
  workflow_run:
    workflows: [Prepare release candidate]
    types: [requested, in_progress, completed]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  eligibility:
    name: Evaluate release eligibility
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute the PR head in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set Release readiness commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/pipeline.mjs readiness
