name: CI
on:
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: ${{ !(startsWith(github.head_ref, 'release/') && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: ./.github/workflows/checks.yml
  gate:
    # Release PRs use the CI gate from their exact release-branch preparation.
    name: ${{ (startsWith(github.head_ref, 'release/') && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) && 'Release PR routing' || 'CI' }}
    if: always() && !(startsWith(github.head_ref, 'release/') && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Require all application checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
