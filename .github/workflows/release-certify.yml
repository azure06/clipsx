name: Verify release for merge
run-name: 'Verify candidate ${{ inputs.candidate_id }} for PR #${{ inputs.pr_number }} at ${{ inputs.head_revision }}'
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Exact finalized candidate ID
        required: true
        type: string
      pr_number:
        description: Release PR to verify before the maintainer merges it
        required: true
        type: string
      head_revision:
        description: Exact release PR head to verify
        required: true
        type: string
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_NEXT_PUBLIC_SITE_URL: ${{ vars.VITE_NEXT_PUBLIC_SITE_URL }}
  SENTRY_DESKTOP_DSN: ${{ vars.SENTRY_DESKTOP_DSN }}
permissions:
  contents: write
  actions: read
  issues: write
  statuses: write
  pull-requests: write
concurrency:
  group: release-verification-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify packages and enable maintainer merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Map public release environment
        run: node scripts/release/core/environment.mjs
      - uses: ./.github/actions/release-verifier
      - name: Bind verified files to this PR revision
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          RELEASE_PR_NUMBER: ${{ inputs.pr_number }}
          RELEASE_HEAD: ${{ inputs.head_revision }}
        run: node scripts/release/pipeline.mjs verify-for-merge "$CANDIDATE_ID" "$RELEASE_PR_NUMBER" "$RELEASE_HEAD"
