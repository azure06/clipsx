name: Certify candidate
run-name: Certify candidate ${{ inputs.candidate_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Exact finalized candidate ID
        required: true
        type: string
      pr_number:
        description: Release PR to certify
        required: true
        type: string
      evidence:
        description: HTTPS reference to installed-platform and upgrade evidence
        required: true
        type: string
      all_platforms_passed:
        description: Windows, both Mac architectures, AppImage and deb installed checks and upgrades passed
        required: true
        default: false
        type: boolean
      mac_extensions_passed:
        description: Installed extension installation, execution and restart passed on both Mac architectures
        required: true
        default: false
        type: boolean
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_NEXT_PUBLIC_SITE_URL: ${{ vars.VITE_NEXT_PUBLIC_SITE_URL }}
  SENTRY_DESKTOP_DSN: ${{ vars.SENTRY_DESKTOP_DSN }}
permissions:
  contents: write
  actions: read
  statuses: write
  pull-requests: write
concurrency:
  group: candidate-${{ inputs.candidate_id }}
  cancel-in-progress: false
jobs:
  certification:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Map public release environment
        run: node scripts/release/core/environment.mjs
      - uses: ./.github/actions/release-verifier

      - name: Record immutable certification and release readiness
        # Verification runs against final distributed bytes before recording approval.
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          CERTIFICATION_EVIDENCE: ${{ inputs.evidence }}
          RELEASE_PR_NUMBER: ${{ inputs.pr_number }}
          CERTIFY_MAC_EXTENSIONS: ${{ inputs.mac_extensions_passed }}
          CERTIFY_ALL_PLATFORMS: ${{ inputs.all_platforms_passed }}
        run: node scripts/release/pipeline.mjs certify "$CANDIDATE_ID" "$RELEASE_PR_NUMBER"
