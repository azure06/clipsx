name: Build release app
on:
  push:
    branches: ['release/*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.route.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .tooling
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: route
        run: node .tooling/scripts/release/inputs.mjs
  checks:
    needs: route
    if: needs.route.outputs.build == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      release: true
    secrets: inherit
  save-build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .tooling
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ needs.checks.outputs.build-attempt }}
          path: .release
      - name: Save complete build identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .tooling/scripts/release/builds.mjs ready
      - uses: actions/upload-artifact@v4
        with:
          name: build-ready-${{ needs.checks.outputs.build-attempt }}
          path: .release/candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  gate:
    name: CI
    if: always()
    needs: [route, checks, save-build]
    runs-on: ubuntu-latest
    steps:
      - env:
          ROUTE: ${{ needs.route.result }}
          BUILD: ${{ needs.route.outputs.build }}
          CHECKS: ${{ needs.checks.result }}
          SAVED: ${{ needs.save-build.result }}
        run: test "$ROUTE" = success && { test "$BUILD" != true || { test "$CHECKS" = success && test "$SAVED" = success; }; }
