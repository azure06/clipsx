name: Build release app
on:
  push:
    branches: ['release/*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.route.outputs.build }}
      tooling: ${{ steps.route.outputs.tooling }}
      docs: ${{ steps.route.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .tooling
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: route
        run: node .tooling/scripts/release/core/inputs.mjs
  lightweight:
    needs: route
    if: needs.route.outputs.docs == 'true' || (needs.route.outputs.build != 'true' && needs.route.outputs.tooling == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate documentation links
        if: needs.route.outputs.docs == 'true'
        run: node scripts/release/core/docs.mjs
      - name: Validate release-only changes
        if: needs.route.outputs.build != 'true' && needs.route.outputs.tooling == 'true'
        run: node --test scripts/release/release.test.mjs
      - uses: raven-actions/actionlint@v2
        if: needs.route.outputs.build != 'true' && needs.route.outputs.tooling == 'true'
  checks:
    needs: route
    if: needs.route.outputs.build == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      release: true
    secrets: inherit
  save-build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .tooling
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ needs.checks.outputs.build-attempt }}
          path: .release
      - name: Save complete build identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .tooling/scripts/release/build/builds.mjs ready
      - uses: actions/upload-artifact@v4
        with:
          name: build-ready-${{ needs.checks.outputs.build-attempt }}
          path: .release/candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  gate:
    name: CI
    if: always()
    needs: [route, checks, save-build, lightweight]
    runs-on: ubuntu-latest
    steps:
      - env:
          ROUTE: ${{ needs.route.result }}
          BUILD: ${{ needs.route.outputs.build }}
          CHECKS: ${{ needs.checks.result }}
          SAVED: ${{ needs.save-build.result }}
          LIGHTWEIGHT: ${{ needs.lightweight.result }}
        run: test "$ROUTE" = success && { test "$LIGHTWEIGHT" = success || test "$LIGHTWEIGHT" = skipped; } && { test "$BUILD" != true || { test "$CHECKS" = success && test "$SAVED" = success; }; }
