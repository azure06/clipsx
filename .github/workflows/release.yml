# =============================================================================
# Release — Auto-build & release when code lands on main
# =============================================================================
# Flow:
#   1. You open a PR → CI runs (lint, test, build-check)
#   2. Everything green → you merge to main
#   3. This workflow runs → builds native installers for all platforms
#   4. Creates a GitHub Release with the version from tauri.conf.json
#
# The version is read from src-tauri/tauri.conf.json automatically.
# Just bump the version there before merging your PR.
#
# You can also trigger this manually for testing without creating a release.
# =============================================================================

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".editorconfig"
      - ".prettierrc"
      - ".vscode/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only — do NOT create a release"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# Only one release at a time
concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "20.19.0"

jobs:
  # ---------------------------------------------------------------------------
  # Check if the version changed — skip release if it didn't.
  # This prevents a new release for docs-only or config-only changes.
  # ---------------------------------------------------------------------------
  check-version:
    name: "Check version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tauri.conf.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: v${VERSION}"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git tag -l "${{ steps.get_version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⏭️  Tag ${{ steps.get_version.outputs.version }} already exists — skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "🆕 Tag ${{ steps.get_version.outputs.version }} is new — will release"
          fi

      - name: Decide whether to release
        id: decide
        run: |
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "🧪 Dry run — will build but not release"
          elif [[ "${{ steps.check_tag.outputs.exists }}" == "true" ]]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Build the Tauri app on every target platform.
  # ---------------------------------------------------------------------------
  build-and-release:
    name: "Build (${{ matrix.settings.name }})"
    needs: check-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macOS — Apple Silicon (M1+)
          - name: macOS-arm64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin"

          # macOS — Intel
          # - name: macOS-x64
          #   os: macos-latest
          #   args: "--target x86_64-apple-darwin"
          #   rust_targets: "x86_64-apple-darwin"

          # Windows x64
          - name: Windows-x64
            os: windows-latest
            args: ""
            rust_targets: ""

          # Linux x64
          - name: Linux-x64
            os: ubuntu-24.04
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.settings.os }}

    steps:
      - uses: actions/checkout@v4

      # --- System deps (Linux only) ---
      - name: Install system dependencies (Linux)
        if: startsWith(matrix.settings.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev

      # --- Node ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # --- Rust ---
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # --- Frontend deps ---
      - name: Install frontend dependencies
        run: npm ci

      # --- Build + Release ---
      - name: Build & upload to release
        if: needs.check-version.outputs.should_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.check-version.outputs.version }}
          releaseName: "ClipsX ${{ needs.check-version.outputs.version }}"
          releaseBody: |
            ## ClipsX ${{ needs.check-version.outputs.version }}

            ### Download
            | Platform | File |
            |----------|------|
            | **macOS (Apple Silicon)** | `.dmg` (arm64) |
            | **macOS (Intel)** | `.dmg` (x64) |
            | **Windows** | `.msi` or `-setup.exe` |
            | **Linux** | `.deb` or `.AppImage` |

            ### Release Notes
            - Draft release: run smoke tests before publishing.
            - Windows artifacts should be code-signed on the release laptop before public distribution.
            - macOS artifacts are ad-hoc signed for v0.1.0 and may require manual allow-listing in Privacy & Security on first launch.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.settings.args }}

      # --- Build only (no release — dry run or version unchanged) ---
      - name: Build only (no release)
        if: needs.check-version.outputs.should_release != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.settings.args }}

      # --- Upload artifacts for inspection regardless ---
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipsx-${{ matrix.settings.name }}
          path: |
            src-tauri/target/**/release/bundle/**/*
          retention-days: 7
