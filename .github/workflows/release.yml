name: Prepare release candidate
on:
  push:
    branches: ['release/*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepare-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '24'
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      release: true
    secrets: inherit
  stage:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*-${{ github.run_attempt }}
          path: .release/packages
      - uses: actions/download-artifact@v4
        with:
          name: windows-signing-inputs-${{ github.run_attempt }}
          path: .release/windows-kit
      - name: Stage candidate and print Windows signing instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/pipeline.mjs stage
  gate:
    name: CI
    if: always()
    needs: [checks, stage]
    runs-on: ubuntu-latest
    steps:
      - name: Require complete candidate preparation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.RESULTS)).some(job => job.result !== "success")) process.exit(1)'
