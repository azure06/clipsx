name: Finalize release candidate
run-name: Finalize candidate ${{ inputs.candidate_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Exact candidate ID printed by preparation
        required: true
        type: string
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_NEXT_PUBLIC_SITE_URL: ${{ vars.VITE_NEXT_PUBLIC_SITE_URL }}
  VITE_SENTRY_DSN: ${{ vars.SENTRY_DESKTOP_DSN }}
permissions:
  contents: write
  actions: read
concurrency:
  group: candidate-${{ inputs.candidate_id }}
  cancel-in-progress: false
jobs:
  state:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      finalized: ${{ steps.state.outputs.finalized }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: node scripts/release/pipeline.mjs finalization-state "$CANDIDATE_ID"
  windows-verification:
    needs: state
    if: needs.state.outputs.finalized != 'true'
    runs-on: windows-latest
    outputs:
      installer: ${{ steps.download.outputs.installer }}
      attempt: ${{ steps.download.outputs.attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download exact Windows submission
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
        run: |
          node scripts/release/pipeline.mjs download-windows "$env:CANDIDATE_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - name: Verify installed signed executable and uninstaller
        env:
          WINDOWS_SIGNING_CERT_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERT_THUMBPRINT }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          INSTALLER: ${{ steps.download.outputs.installer }}
        run: ./scripts/release/verify-windows.ps1 -Installer $env:INSTALLER -CandidateId $env:CANDIDATE_ID
      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: windows-verification-${{ github.run_attempt }}
          path: .release/native-evidence-windows-x64.json
          if-no-files-found: error
          retention-days: 30
  finalize:
    needs: [state, windows-verification]
    if: always() && needs.state.result == 'success' && (needs.state.outputs.finalized == 'true' || needs.windows-verification.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: ./.github/actions/release-verifier

      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        if: needs.state.outputs.finalized != 'true'
        with:
          name: windows-verification-${{ needs.windows-verification.outputs.attempt }}
          path: .release
      - name: Finalize exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release/pipeline.mjs finalize "$CANDIDATE_ID" .release/native-evidence-windows-x64.json
