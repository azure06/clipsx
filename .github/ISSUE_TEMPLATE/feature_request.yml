name: Feature request
description: Suggest an improvement to a ClipsX workflow.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Focus on the workflow problem and use synthetic examples.
        Please discuss substantial changes with the maintainer before starting implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe who encounters the problem, what they do today, and where the workflow breaks down.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain what a successful improvement would let you do. A specific implementation is optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Include existing app features or extensions you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant platforms, clipboard formats, extension ideas, or harmless examples. Redact private information.
