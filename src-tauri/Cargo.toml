[package]
name = "clipsx"
version = "0.1.0"
description = "AI-powered clipboard manager"
authors = ["gabriele.sato"]
edition = "2021"

[lib]
name = "clipsx_lib"
# "staticlib" and "cdylib" are required by the Tauri build system for mobile
# targets (iOS = staticlib, Android = cdylib). They are NOT needed for desktop-only
# builds but are kept here for future mobile support.
#
# SIDE EFFECT ON WINDOWS TESTS:
# The "cdylib" type causes the lib test binary to link Tauri's WebView2 GUI
# runtime at load time. When `cargo test --lib` tries to run that binary
# headlessly, Windows cannot find the expected GUI entrypoint and crashes with:
#   STATUS_ENTRYPOINT_NOT_FOUND (exit code 0xc0000139)
#
# WORKAROUND: run tests via `--bin clipsx` (main.rs) instead of `--lib`.
# main.rs declares all the same modules as lib.rs — plus `plugins` — so no
# tests are skipped. If mobile targets are ever dropped, remove "staticlib"
# and "cdylib" from this list and you can go back to plain `cargo test`.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "clipsx"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.9.0", features =  ["sqlite", "runtime-tokio", "migrate"] }
sha2 = "0.10"
anyhow = "1.0.102"
tempfile = "3.27.0"
keyring = "4.1.5"
uuid = { version = "1.18.1", features = ["v7"] }
arboard = "3.6.1"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
url = "2.5.7"
base64 = "0.22.1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1.0"
toml = "0.8"
wasmtime = { version = "47.0.3", default-features = false, features = ["async", "component-model", "component-model-async", "cranelift", "runtime", "std"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-decorum = "1.1.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Media_Ocr",
  "Globalization",
  "Storage_Streams",
  "Graphics_Imaging"
] }
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"
core-graphics = "0.25"
foreign-types = "0.5"
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
