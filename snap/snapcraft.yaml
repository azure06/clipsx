name: clipsx
title: ClipsX
base: core24
version: '0.1.3'
summary: Free, programmable desktop clipboard
description: |
  ClipsX keeps clipboard history searchable and supports previews,
  transformations, OCR and extensions. This development package targets
  Linux desktops with an X11 session.
license: Apache-2.0
source-code: https://github.com/azure06/clipsx
issues: https://github.com/azure06/clipsx/issues
grade: devel
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  clipsx:
    command: usr/bin/clipsx
    desktop: usr/share/applications/ClipsX.desktop
    extensions: [gnome]
    environment:
      GDK_BACKEND: x11
      DISABLE_WAYLAND: '1'
      TESSDATA_PREFIX: $SNAP/usr/share/tesseract-ocr/5/tessdata
    plugs:
      - home
      - network
      - removable-media
      - password-manager-service

parts:
  clipsx:
    plugin: dump
    source: https://github.com/azure06/clipsx/releases/download/v0.1.3/ClipsX_0.1.3_linux-x64.deb
    source-type: deb
    source-checksum: sha256/14c9c991d3cafd27dc61e7ab8fa1098dfb4ee5553b1cac5b06a044fa2ffd4786
    stage-packages:
      - libayatana-appindicator3-1
      - libxdo3
      - xdg-utils
      - tesseract-ocr
      - tesseract-ocr-eng
      - tesseract-ocr-jpn
    override-build: |
      craftctl default
      sed -i 's|^Icon=clipsx$|Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/clipsx.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/ClipsX.desktop"
