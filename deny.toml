[licenses]
confidence-threshold = 0.8
# Wasmtime/Cranelift use the LLVM exception; Windows clipboard uses Boost.
# tiny-keccak uses CC0; the Mozilla TLS root data uses CDLA-Permissive.
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib", "MPL-2.0", "OpenSSL", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
